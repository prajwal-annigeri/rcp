syntax = "proto3";

option go_package = "grpc/orcapb;orcapb";

package orcapb;

import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";

enum LogType {
  OPERATION = 0;
  FAILURE = 1;
  RECOVERY = 2;
}

message LogEntry {
  LogType logType = 1;
  int64 term = 2;

  // payload is only needed when logType is OPERATION; FAILURE/RECOVERY entries
  // can leave it empty.
  bytes payload = 3;

  // nodeId is required when the log represents a FAILURE or RECOVERY so
  // the system knows which node to affect.
  string nodeId = 4;
}

message AppendEntriesRequest {
  int64 term = 1;
  string leaderId = 2;
  int64 prevLogIndex = 3;
  int64 prevLogTerm = 4;
  repeated LogEntry entries = 5;
  int64 leaderCommit = 6;
}

message AppendEntriesResponse {
  int64 term = 1;
  bool success = 2;
  string error = 3;
}

message RequestVoteRequest {
  int64 term = 1;
  string candidateId = 2;
  int64 lastLogIndex = 3;
  int64 lastLogTerm = 4;
}

message RequestVoteResponse {
  int64 term = 1;
  bool voteGranted = 2;
  string error = 3;
}

message StoreRequest {
  string key = 1;
  string value = 2;
  string bucket = 3;
}

message GetRequest {
  string key = 1;
  string bucket = 2;
}

message DeleteRequest {
  string key = 1;
  string bucket = 2;
}

enum FailureType {
  REVIVE = 0;
  RANDOM = 1;
  LEADER = 2;
  REPLICA = 3;
}

message CauseFailureRequest {
  FailureType type = 1;
}

service Orca {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc CauseFailure(CauseFailureRequest) returns (google.protobuf.BoolValue);
  rpc Health(google.protobuf.Empty) returns (google.protobuf.BoolValue);
}
