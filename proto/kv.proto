syntax = "proto3";

option go_package = "rcp/grpc/kvpb;kvpb";

package kvpb;

message StoreRequest {
  string bucket = 1;
  string key = 2;
  string value = 3;
}

message GetRequest {
  string key = 1;
  string bucket = 2;
}

message DeleteRequest {
  string key = 1;
  string bucket = 2;
}

enum ErrorType {
  NOT_ALIVE = 0;
  NOT_LEADER = 1;
  NOT_FOUND = 2;
  BAD_REQUEST = 3;
  UNEXPECTED = 4;
  TIMEOUT = 5;
}

message ClientResponse {
  bool success = 1;
  ErrorType error = 2;
  string value = 3;
}

enum OperationType {
  OPERATION_UNKNOWN = 0;
  OPERATION_PUT = 1;
  OPERATION_DELETE = 2;
}

message Operation {
  OperationType op = 1;
  string bucket = 2;
  string key = 3;
  string value = 4;
}

service KVStore {
  rpc Store(StoreRequest) returns (ClientResponse);
  rpc Get(GetRequest) returns (ClientResponse);
  rpc Delete(DeleteRequest) returns (ClientResponse);
}
