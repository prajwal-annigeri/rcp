syntax = "proto3";

option go_package = "grpc/kvpb;kvpb";

package kvpb;

enum OperationType {
  STORE = 0;
  GET = 1;
  DELETE = 2;
}

message KVRequest {
  OperationType op = 1;
  string bucket = 2;
  string key = 3;
  string value = 4;
}

enum ErrorType {
  NOT_ALIVE = 0;
  NOT_LEADER = 1;
  NOT_FOUND = 2;
  BAD_REQUEST = 3;
  UNEXPECTED = 4;
  TIMEOUT = 5;
}

message ClientResponse {
  bool success = 1;
  ErrorType error = 2;
  string value = 3;
}

service KVStore {
  rpc PerformOperation(KVRequest) returns (ClientResponse);
}
