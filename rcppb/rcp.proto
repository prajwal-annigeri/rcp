syntax = "proto3";
import "google/protobuf/wrappers.proto";
package rcppb;

option go_package = "/rcppb";

enum LogType {
  STORE = 0;
  DELETE = 1;
  FAILURE = 2;
  RECOVERY = 3;
  RECONFIG = 4;
}

enum ReconfigPhase {
  RECONFIG_PHASE_UNSPECIFIED = 0;
  RECONFIG_PHASE_TRANSITION = 1;
  RECONFIG_PHASE_FINALIZE = 2;
}

message ReconfigLog {
    int64 epoch = 1;
    string mode = 2;
    repeated string fromVoters = 3;
    repeated string toVoters = 4;
    ReconfigPhase phase = 5;
}

message LogEntry {
    LogType logType = 1;
    string nodeId = 2;
    string key = 3;
    string value = 4;
    string bucket = 5;
    int64 term = 6;
    ReconfigLog reconfig = 7;
    // string callbackChannelId = 8;
}

message AppendEntriesReq {
    int64 term = 1;
    string leaderId = 2;
    int64 prevLogIndex = 3;
    int64 prevLogTerm = 4;
    repeated LogEntry entries = 5;
    int64 leaderCommit = 6;
    // int64 delay = 7;
}

message AppendEntriesResponse {
    int64 term = 1;
    bool success = 2;
}

message RequestVoteReq {
    int64 term = 1;
    string candidateId = 2;
    int64 lastLogIndex = 3;
    int64 lastLogTerm = 4;
    // int64 delay = 5;
}

message RequestVoteResponse {
    int64 term = 1;
    bool voteGranted = 2;
}

message StoreRequest {
    string key = 1;
    string value = 2;
    string bucket = 3;
}

message GetRequest {
    string key = 1;
    string bucket = 2;
}

message DeleteRequest {
    string key = 1;
    string bucket = 2;
}

enum FailureType {
    REVIVE = 0;
    RANDOM = 1;
    LEADER = 2;
    REPLICA = 3;
}

message CauseFailureRequest {
    FailureType type = 1;
}

enum ErrorType {
    NOT_ALIVE = 0;
    NOT_LEADER = 1;
    NOT_FOUND = 2;
    BAD_REQUEST = 3;
    UNEXPECTED = 4;
    TIMEOUT = 5;
    NOT_SUPPORTED = 6;
}

message ClientResponse {
    bool success = 1;
    ErrorType error = 2;
    string value = 3;
}

message ReconfigureRequest {
    repeated string voterIds = 1;
}

// message PartitionReq {
//     repeated string reachableNodes = 1;
// }

// message DelayRequest {
//     string nodeId = 1;
//     int64 delay = 2;
// }

message HealthzRequest {}

service RCP {
    rpc AppendEntries(AppendEntriesReq) returns (AppendEntriesResponse) {}
    rpc RequestVote (RequestVoteReq) returns (RequestVoteResponse) {}
    // rpc SetStatus(google.protobuf.BoolValue) returns (google.protobuf.BoolValue) {}
    // rpc Partition(PartitionReq) returns (google.protobuf.BoolValue) {}
    // rpc Delay(DelayRequest) returns (google.protobuf.BoolValue) {}
    rpc Healthz(HealthzRequest) returns (google.protobuf.BoolValue) {}
    rpc Store(StoreRequest) returns (ClientResponse) {}
    rpc Get(GetRequest) returns (ClientResponse) {}
    rpc Delete(DeleteRequest) returns (ClientResponse) {}
    rpc CauseFailure(CauseFailureRequest) returns (ClientResponse) {}
    rpc Reconfigure(ReconfigureRequest) returns (ClientResponse) {}
}
